# ScrapeHub — tam dağıtık mod.
#
# Kurulum:  cp .env.example .env   # sonra .env içindeki sırları doldurun
#           docker compose up --build
#
# Güvenli varsayılanlar:
#   - Tüm portlar yalnız 127.0.0.1'e (bu makineye) yayınlanır; ağdaki başka
#     makineler Redis/Postgres/browserless/Flower/Jaeger'a ulaşamaz.
#   - Redis, Postgres, browserless ve Flower parola/token ister; eksikse
#     `docker compose` açıklayıcı bir hatayla durur.
#   - API'yi ağa açmak isterseniz .env içinde API_BIND_ADDR=0.0.0.0 yapın
#     (API, API_KEY ile korunur).
#   - Ağ ayrımı (tarayıcı yolunun SSRF koruması): browserless yalnız `browser`
#     ağındadır ve bu ağ `internal`dır: oradan internete, host'a (yayımlanmış
#     portlar, host.docker.internal) ve `backend` ağına (Redis/Postgres/Jaeger/
#     Flower/API) yol yoktur. Tarayıcının tek çıkışı `egress` servisidir
#     (core/egress_proxy.py): her bağlantının hedefini netguard ile denetler,
#     iç/özel adresleri reddeder ve denetlenen IP'ye bağlanır. Worker,
#     browserless'a bağlanmak için `browser` ağında da bulunur.

# api / worker / flower için ortak ayarlar
x-app-env: &app-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD ayarlanmamış - .env.example dosyasına bakın}@redis:6379/0
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-scrape}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ayarlanmamış - .env.example dosyasına bakın}@postgres:5432/${POSTGRES_DB:-scrapehub}
  JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
  BROWSERLESS_URL: ws://browserless:3000?token=${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN ayarlanmamış - .env.example dosyasına bakın}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  API_KEY: ${API_KEY:?API_KEY ayarlanmamış - .env.example dosyasına bakın}
  PUBLIC_READ: ${PUBLIC_READ:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
  MAX_PAGES_LIMIT: ${MAX_PAGES_LIMIT:-100}

networks:
  # Uygulama servisleri ve veri katmanı.
  backend:
  # browserless + worker + egress. internal: bu ağdan dışarıya (internet, host) yol yok.
  browser:
    internal: true
  # Yalnız egress proxy'sinin internete çıkışı.
  outbound:

services:
  redis:
    image: redis/redis-stack:7.4.0-v8
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD ayarlanmamış - .env.example dosyasına bakın}
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # yalnız sağlık denetimindeki redis-cli için
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"   # RedisInsight arayüzü
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ayarlanmamış - .env.example dosyasına bakın}
      POSTGRES_DB: ${POSTGRES_DB:-scrapehub}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # JavaScript render ve WAF bypass için Headless Chrome
  browserless:
    image: browserless/chrome:1.61.1-chrome-stable
    environment:
      MAX_CONCURRENT_SESSIONS: 10
      TOKEN: ${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN ayarlanmamış - .env.example dosyasına bakın}
      # Ek savunma: WebRTC'nin UDP'si (STUN/TURN) proxy'ye uğramaz; bu bayrakla
      # tarayıcı proxy dışı UDP kullanmaz. (internal ağ zaten dışarıya yol vermez.)
      DEFAULT_LAUNCH_ARGS: '["--webrtc-ip-handling-policy=disable_non_proxied_udp"]'
    # Port yok: internal ağdaki konteynerin portu yayımlanamaz; browserless'ın
    # 127.0.0.1:3000 portunu `egress` servisi taşır.
    networks: [browser]

  # Tarayıcının tek çıkış noktası: SSRF denetimli HTTP/CONNECT proxy'si.
  egress:
    build: .
    command: python -m core.egress_proxy --port 8899 --forward 3000=browserless:3000
    environment:
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
    ports:
      - "127.0.0.1:3000:3000"   # browserless (token ister)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8899), 2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [browser, outbound]

  # Dağıtık İzleme (Distributed Tracing) Arayüzü — kimlik doğrulaması yok,
  # bu yüzden yalnız yerel makineye açık.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "127.0.0.1:16686:16686" # Web UI
      - "127.0.0.1:4318:4318"   # OTLP HTTP Alıcı
    networks: [backend]

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports:
      - "${API_BIND_ADDR:-127.0.0.1}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [backend]

  worker:
    build: .
    command: celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      <<: *app-env
      # Tarayıcının tüm trafiği bu proxy'den (browserless'ın gördüğü adresle).
      BROWSER_EGRESS_PROXY: http://egress:8899
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      browserless:
        condition: service_started
      egress:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [backend, browser]

  flower:
    build: .
    command: celery -A workers.celery_app.celery_app flower --port=5555
    environment:
      # Flower görev modüllerini içe aktarır; bu sırada veritabanına da
      # bağlandığı için uygulamayla aynı ortamı alır.
      <<: *app-env
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD ayarlanmamış - .env.example dosyasına bakın}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    networks: [backend]
